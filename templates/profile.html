{% extends "base.html" %}

{% block title %}User Profile{% endblock %}

{% block content %}
<div class="profile-card">
    <h2>{{ user.name }}</h2>
    <p class="bio">{{ user.bio }}</p>
    <div class="about">{{ user.about_html }}</div>

    
    <div class="user-content">
        {{ user.custom_html }}
    </div>
    

    <p class="email">Contact: {{ user.email }}</p>
</div>
{% endblock %}
