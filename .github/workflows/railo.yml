name: Railo

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: write
  security-events: write

jobs:
  railo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Railo
        uses: IWEBai/railo-action@v2
        with:
          license_key: ${{ secrets.RAILO_LICENSE_KEY }}
          mode: enforce
          base_branch: ${{ github.base_ref }}
